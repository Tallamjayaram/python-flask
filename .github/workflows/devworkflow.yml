name: Develop Workflow

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Image Tag
        run: |
          IMAGE_TAG=develop-$(date +'%Y%m%d-%H%M')
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t jayaramtallam/python-flask:${IMAGE_TAG} .

      - name: Push Docker Image
        run: |
          docker push jayaramtallam/python-flask:${IMAGE_TAG}

      - name: Update Kubernetes Manifest
        run: |
          sed -i "s|image: .*|image: jayaramtallam/python-flask:${IMAGE_TAG}|g" .github/k8s/deploy.yml

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update image to ${{ env.IMAGE_TAG }}"
          title: "Update deployment image to ${{ env.IMAGE_TAG }}"
          body: |
            Automated PR generated by GitHub Actions.

            - Docker image built and pushed
            - Updated deploy.yml image tag

          branch: image-update-${{ env.IMAGE_TAG }}
          delete-branch: true
